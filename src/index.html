<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./output.css" />
  <title>Project Room New</title>
</head>

<body>
  <header class="bg-slate-100 p-4 pb-8 flex flex-col items-center justify-center">
    <h1 class="text-2xl   font-bold text-sky-600 p-4">Class Room Real Time</h1>
    <p class="text-slate-600">Bem-vindo à nossa sala de aula em tempo real!</p>
    <div class="ms:container-md container mx-auto p-4">
      <nav class="mx-auto bg-emerald-600 p-4 shadow-md shadow-amber-50/10">
        <div class="mb-2 text-center mx-auto ">
          <h3 class="text-2xl font-semibold text-gray-100">Choose a Chat Room</h3>
        </div>
        <ul class="flex chat-room  flex-wrap justify-center pt-8 items-center mx-auto space-x-4">
          <li><a href="#general" class="text-amber-50 hover:text-amber-400 bg-emerald-900 p-2 rounded-md">#General</a></li>
          <li><a href="#technology" class="text-amber-50 hover:text-amber-400 bg-emerald-900 p-2 rounded-md">#Technology</a></li>
          <li><a href="#music" class="text-amber-50 hover:text-amber-400 bg-emerald-900 p-2 rounded-md">#Music</a></li>
          <li><a href="#education" class="text-amber-50 hover:text-amber-400 bg-emerald-900 p-2 rounded-md">#Education</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class=" bg-slate-100 flex  items-center justify-center ">
    <section class="flex flex-col  md:flex-row items-center justify-center gap-8 p-4">
      <article>
        <h1>Form section Chat</h1>
        <div>
          <ul id="message-list">

          </ul>
        </div>
        <form id="new-chat-form" class="flex flex-col gap-4 mt-16">
          <div class="bg-slate-200 p-2 pl-4 flex items-center justify-between pr-2 space-x-2 rounded-md">
            <label for="message" class="message-only text-emerald-950 font-medium mr-2">Your Message</label>
            <input type="text" id="message" name="input" placeholder="Enter your message" class="p-2 outline-1 outline-emerald-500 focus-within:ring-2 focus-within:ring-green-500 rounded border-0" required />
            <button type="submit" class="bg-emerald-500 text-white p-2 rounded hover:bg-emerald-900 cursor-pointer">Send Message</button>
          </div>
        </form>
        <form id="update-name-form" class="flex flex-col gap-4 mt-6">
          <div class="bg-slate-200 p-2 pl-4 flex items-center justify-between pr-2 rounded-md">
            <label for="updateName" class="name-only text-emerald-950 font-medium mr-2">Update Name</label>
            <input type="text" id="updateName" name="updateName" placeholder="Enter your name" class="p-2 outline-1 outline-emerald-500 focus-within:ring-2 focus-within:ring-green-500 rounded border-0" />
            <button type="submit" class="bg-emerald-500 text-white p-2 rounded hover:bg-emerald-900 cursor-pointer">Update Name</button>
          </div>
        </form>
      </article>
      <aside>
        <div class="container bg-slate-300 py-8 w-full p-2">

          <h1>Chat section</h1>
          <p>Real-time chat messages will appear here.</p>
        </div>
      </aside>
    </section>
  </main>

</body>

</html>
